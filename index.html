<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREDFÁCIL | Simulação de Empréstimo</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f5132,#14532d);
    color:white;
    text-align:center;
}

.container{
    padding:30px 20px;
    max-width:500px;
    margin:auto;
}

.logo{
    width:180px;
    margin-bottom:15px;
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

.sub{
    font-size:15px;
    opacity:0.9;
    margin-bottom:25px;
}

.card{
    background:white;
    color:#333;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    background:#f59e0b;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

button:hover{
    background:#d97706;
}

.consultora{
    margin-top:30px;
}

.consultora img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #f59e0b;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    object-fit:cover;
}

footer{
    margin-top:30px;
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="container">

<img src="LOGO.png" class="logo">

<h1>Simule seu Empréstimo Agora</h1>
<p class="sub">Atendimento rápido e personalizado via WhatsApp</p>

<div class="card">

<form id="simulacaoForm">

<input type="text" id="nome" placeholder="Nome completo" required>
<input type="text" id="cpf" placeholder="CPF" required>
<input type="date" id="nascimento" required>

<select id="situacao" required>
<option value="">Você é:</option>
<option>Carteira assinada</option>
<option>Aposentado / Pensionista INSS</option>
<option>Servidor Público</option>
<option>SIAPE</option>
<option>Forças Armadas</option>
<option>Possui conta de luz (ENEL) no seu nome</option>
</select>

<button type="submit">Quero fazer uma simulação!</button>

</form>

</div>

<div class="consultora">
<img src="CONSULTORA.jpg">
<p><strong>Consultora Liliane</strong><br>Maricá - RJ</p>
</div>

<footer>
CREDFÁCIL © 2026 - Solicitações de Empréstimos
</footer>

</div>

<script>
document.getElementById("simulacaoForm").addEventListener("submit", function(e){
e.preventDefault();

var nome = document.getElementById("nome").value;
var cpf = document.getElementById("cpf").value;
var nascimento = document.getElementById("nascimento").value;
var situacao = document.getElementById("situacao").value;

var mensagem = "Quero fazer uma simulação!%0A%0A" +
"Nome: " + nome + "%0A" +
"CPF: " + cpf + "%0A" +
"Nascimento: " + nascimento + "%0A" +
"Situação: " + situacao;

window.open("https://wa.me/5521972208880?text=" + mensagem, "_blank");
});
</script>

</body>
  </html>
